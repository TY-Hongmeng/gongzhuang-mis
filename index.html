<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>My Trae Project</title>
    <script>
      (function(){
        try {
          if (!location.hash) {
            location.hash = '/login'
          }
        } catch(e) {}

        try {
          var ls = window.localStorage
          var max = 900000
          var v = ls.getItem('process_routes_map')
          if (v && v.length > max) {
            ls.removeItem('process_routes_map')
          }
          try {
            ls.setItem('__ls_test', '1')
            ls.removeItem('__ls_test')
          } catch (e2) {
            ;['process_routes_map','process_done_map','temporary_plans','temporary_hidden_ids'].forEach(function(k){
              try { ls.removeItem(k) } catch(e3) {}
            })
          }
        } catch(e4) {}
      })();
    </script>
    <script>
      (function(){
        try {
          var ua = navigator.userAgent || ''
          var isIOS = /iP(hone|ad|od)/i.test(ua)
          var isEmbedded = /MicroMessenger|baiduboxapp|Baidu/i.test(ua)
          var key = '__ios_boot_recover_1_21_16__'
          var done = false
          try {
            done = window.sessionStorage && window.sessionStorage.getItem(key) === '1'
          } catch (e1) {}
          if (!isIOS || !isEmbedded || done) return
          try {
            if (window.sessionStorage) window.sessionStorage.setItem(key, '1')
          } catch (e2) {}
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs){
                regs.forEach(function(reg){ reg.unregister() })
              }).catch(function(){})
            }
          } catch (e3) {}
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function(names){
                return Promise.all(names.map(function(name){ return caches.delete(name) }))
              }).catch(function(){})
            }
          } catch (e4) {}
          try {
            if (location.search.indexOf('__ios_reload=1.21.16') === -1) {
              var next = location.href
              next += (next.indexOf('?') === -1 ? '?' : '&') + '__ios_reload=1.21.16'
              location.replace(next)
            }
          } catch (e5) {}
        } catch (e6) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
