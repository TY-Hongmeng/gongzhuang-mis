<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>工装制造管理系统</title>
    <link rel="preconnect" href="https://oltsiocyesbgezlrcxze.supabase.co" />
    <link rel="dns-prefetch" href="https://oltsiocyesbgezlrcxze.supabase.co" />
    <script>
      (function(){
        try {
          if (!location.hash) {
            location.hash = '/login'
          }
        } catch(e) {}

        try {
          var ls = window.localStorage
          var max = 900000
          var v = ls.getItem('process_routes_map')
          if (v && v.length > max) {
            ls.removeItem('process_routes_map')
          }
          try {
            ls.setItem('__ls_test', '1')
            ls.removeItem('__ls_test')
          } catch (e2) {
            ;['process_routes_map','process_done_map','temporary_plans','temporary_hidden_ids'].forEach(function(k){
              try { ls.removeItem(k) } catch(e3) {}
            })
          }
        } catch(e4) {}
      })();
    </script>
    <script type="module">
      // 仅在开发环境执行一次性遮罩清理与 SW 注销（无自动重载/重连）
      if (import.meta.env?.DEV) {
        try {
          const nodes = document.querySelectorAll('vite-error-overlay, #vite-error-overlay, .vite-error-overlay');
          nodes.forEach((el) => el.remove());
        } catch {}

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations?.().then(regs => {
            regs.forEach(r => r.unregister());
          }).catch(() => {});
          
          caches.keys().then(names => {
            Promise.all(names.map(n => caches.delete(n)));
          }).catch(() => {});
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
